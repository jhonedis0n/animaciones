name: Deploy Dedicated Web to GitHub Pages

# Disparador: Se ejecuta en cada push o pull_request fusionado a la rama 'main'
on:
  push:
    branches:
      - main
  # Permite disparar la ejecución manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

# Permisos mínimos requeridos por GitHub Pages API (Principio de menor privilegio)
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente para evitar inconsistencias de estado
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Carga todo el contenido del directorio raíz
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4